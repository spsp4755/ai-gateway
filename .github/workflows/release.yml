name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test -mod=mod ./...

      - name: Build Linux binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist bundle
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=mod -trimpath -ldflags="-s -w" -o dist/ai-gateway ./cmd/ai-gateway
          tar -czf "dist/ai-gateway_${VERSION}_linux_amd64.tar.gz" -C dist ai-gateway
          rm dist/ai-gateway

      - name: Build Docker image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t "ai-gateway:${VERSION}" .
          docker save -o "dist/ai-gateway_${VERSION}_docker-image.tar" "ai-gateway:${VERSION}"

      - name: Create source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format zip --output "dist/ai-gateway_${VERSION}_source.zip" HEAD

      - name: Assemble air-gap bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp -R deploy/airgap/. bundle/
          cp README.md bundle/
          cp "dist/ai-gateway_${VERSION}_linux_amd64.tar.gz" bundle/
          cp "dist/ai-gateway_${VERSION}_docker-image.tar" bundle/
          cp "dist/ai-gateway_${VERSION}_source.zip" bundle/
          (cd bundle && zip -r "../dist/ai-gateway_${VERSION}_airgap-bundle.zip" .)

      - name: Generate checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum \
            "ai-gateway_${VERSION}_linux_amd64.tar.gz" \
            "ai-gateway_${VERSION}_docker-image.tar" \
            "ai-gateway_${VERSION}_source.zip" \
            "ai-gateway_${VERSION}_airgap-bundle.zip" \
            > "ai-gateway_${VERSION}_checksums.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/ai-gateway_${VERSION}_linux_amd64.tar.gz" \
            "dist/ai-gateway_${VERSION}_docker-image.tar" \
            "dist/ai-gateway_${VERSION}_source.zip" \
            "dist/ai-gateway_${VERSION}_airgap-bundle.zip" \
            "dist/ai-gateway_${VERSION}_checksums.txt" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Air-gapped AI gateway release with Linux binary, Docker image tar, source snapshot, and bundle."
